      <stop offset="0%" stop-color="#d9cbb4"/>
      <stop offset="100%" stop-color="#a99a80"/>
    </linearGradient>
    <linearGradient id="silhouette" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#766a59"/>
      <stop offset="100%" stop-color="#5f5444"/>
